<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Баннер | Дизайн на заказ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="banner" onclick="location.href = '#'">
      <div class="banner-bg"></div>

      <div class="banner-content">
        <!-- Левая колонка -->
        <div class="left-column">
          <!-- Вместо текста DESIGN теперь картинка -->
          <img src="./public/MALO ф.png" alt="DESIGN" class="logo animate" />
          <div class="title animate">Дизайн <span>на заказ</span></div>
        </div>

        <!-- Правая колонка с услугами и кнопкой -->
        <div class="right-column">
          <div class="services-grid animate">
            <div class="service-item">📱 Посты</div>
            <div class="service-item">📊 Инфографика</div>
            <div class="service-item">🎬 Моушен</div>
            <div class="service-item">🎨 Логотипы</div>
            <div class="service-item">🌐 Баннеры</div>
            <div class="service-item">📦 Креативы</div>
          </div>
          <button class="cta animate">Заказать →</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
